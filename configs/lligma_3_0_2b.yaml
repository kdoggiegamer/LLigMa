# LLigMa 3.0 2B Configuration
model_type: lligma

# Architecture
vocab_size: 128256
hidden_size: 2048
intermediate_size: 5632
num_hidden_layers: 28
num_attention_heads: 16
num_key_value_heads: 4
head_dim: 128

# MLA
use_mla: true
q_lora_rank: 1536
kv_lora_rank: 512
qk_rope_head_dim: 64
qk_nope_head_dim: 64
v_head_dim: 128
rope_theta: 10000.0
max_position_embeddings: 131072

# RoPE Scaling (YaRN)
rope_scaling:
  type: yarn
  factor: 32.0
  original_max_position_embeddings: 4096
  beta_fast: 32
  beta_slow: 1
  mscale: 1.0
  mscale_all_dim: 0.0

# MoE
use_moe: true
num_experts: 64
num_shared_experts: 2
num_experts_per_tok: 6
moe_intermediate_size: 1408
first_k_dense_replace: 1
norm_topk_prob: true
routed_scaling_factor: 2.5

# Training
rms_norm_eps: 1.0e-6
initializer_range: 0.02
tie_word_embeddings: false

# Reasoning
enable_thinking_mode: true
max_thinking_tokens: 8192

# Special tokens
bos_token_id: 1
eos_token_id: 2
pad_token_id: 0
unk_token_id: 3
