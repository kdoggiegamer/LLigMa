# Small architecture smoke-training preset. This is not the advertised 2B model.
vocab_size: 50257
hidden_size: 64
intermediate_size: 128
num_hidden_layers: 2
num_attention_heads: 4
num_key_value_heads: 1
head_dim: 16
use_mla: true
q_lora_rank: 64
kv_lora_rank: 32
qk_rope_head_dim: 8
qk_nope_head_dim: 8
v_head_dim: 16
max_position_embeddings: 256
use_moe: true
num_experts: 4
num_shared_experts: 1
num_experts_per_tok: 2
moe_intermediate_size: 32
first_k_dense_replace: 1
routed_scaling_factor: 1.0
tie_word_embeddings: true
use_cache: false
